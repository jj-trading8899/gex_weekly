name: Build expected-move page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/dealer-edge/**'
      - 'expected-move/build.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build page from newest capture
        run: python3 expected-move/build.py
      - name: Commit if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add expected-move.html
          git diff --cached --quiet || (git commit -m "expected-move: rebuild page" && git push)
