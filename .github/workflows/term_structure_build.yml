name: Build term structure page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'term-structure/data/raw/**'
      - 'term-structure/build.py'
      - 'term-structure/template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build page from newest snapshot
        run: python3 term-structure/build.py
      - name: Commit if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add term-structure/index.html term-structure/data/built-*.json
          git diff --cached --quiet || (git commit -m "term-structure: rebuild page" && git push)
